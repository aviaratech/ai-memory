name: Quality checks
run-name: am-ci-v1 ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.repo.id }} ${{ github.event.pull_request.base.repo.id }} ${{ github.event.pull_request.base.ref }} ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.base.sha }} ${{ github.event.action }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.run_id || 'validation' }}-${{ github.event.action == 'edited' && github.run_attempt || 'shared' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  selection:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.impact.outputs.run }}
      reason: ${{ steps.impact.outputs.reason }}
      validation: ${{ steps.impact.outputs.validation }}
      validation_run: ${{ steps.impact.outputs.validation_run }}
    steps:
      - name: Check out complete candidate history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Select complete PostgreSQL coverage
        id: impact
        run: node scripts/ci-postgres-impact.mjs select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Record metadata proof branch
        if: ${{ steps.impact.outputs.validation == 'metadata' }}
        run: echo "Required checks will independently verify actual full source coverage."

  linux:
    needs: selection
    if: ${{ needs.selection.outputs.validation != 'metadata' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out full candidate history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = 11.19.0
      - name: Install dependencies once
        run: npm ci
      - name: Install pinned Betterleaks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/betterleaks/betterleaks/releases/download/v1.8.1/betterleaks_1.8.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/betterleaks.tar.gz"
          printf '%s  %s\n' 'efa407244e1ea8e35f582b8a42becdeac08bdead04f68eb752adda722d583c2a' "$RUNNER_TEMP/betterleaks.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/betterleaks.tar.gz" -C "$RUNNER_TEMP" betterleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check disclosure boundary
        run: npm run scan:secrets && npm run scan:secrets:probe
      - name: Check source
        run: npm run checks

  postgres:
    needs: selection
    if: ${{ needs.selection.outputs.validation != 'metadata' && needs.selection.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: ci_memory
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: ai_memory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_memory -d ai_memory_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = 11.19.0
      - name: Build both workspaces for complete integration coverage
        run: |
          npm ci
          npm run build
      - name: Create separate disposable project identity database
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({ connectionString: process.env.AI_MEMORY_DATABASE_URL });
          await client.connect();
          try { await client.query('CREATE DATABASE ai_memory_project_identity_ci OWNER ci_memory'); }
          finally { await client.end(); }
          NODE
        env:
          AI_MEMORY_DATABASE_URL: postgresql://ci_memory:ci_only@127.0.0.1:5432/ai_memory_ci
      - name: Check disposable PostgreSQL integration
        run: npm run test:integration
        env:
          AI_MEMORY_DATABASE_URL: postgresql://ci_memory:ci_only@127.0.0.1:5432/ai_memory_ci
          AI_MEMORY_PROJECT_IDENTITY_TEST_URL: postgresql://ci_memory:ci_only@127.0.0.1:5432/ai_memory_project_identity_ci

  macos:
    needs: selection
    if: ${{ needs.selection.outputs.validation != 'metadata' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = 11.19.0
      - name: Check platform-specific unit and entrypoint behavior
        run: |
          npm ci
          npm run build
          npm run test

  package:
    needs: selection
    if: ${{ needs.selection.outputs.validation != 'metadata' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@11.19.0
          test "$(npm --version)" = 11.19.0
      - name: Assemble both workspace packages
        run: |
          npm ci
          npm run build
      - name: Check package inventories
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/ai-memory-packages"
          mkdir -p "$package_dir"
          for item in 'core:@aviaratech/ai-memory' 'plugin:@aviaratech/ai-memory-plugin'; do
            label="${item%%:*}"
            package="${item#*:}"
            npm pack --workspace "$package" --dry-run --json > "$package_dir/$label-dry-run.json"
            npm pack --workspace "$package" --pack-destination "$package_dir" --json > "$package_dir/$label-pack.json"
          done
          node scripts/ci-package-archives.mjs "$package_dir" \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" \
            '${{ github.event.pull_request.head.sha }}' '${{ github.run_id }}' '${{ github.run_attempt }}'
      - name: Retain public package archives and source digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-package-archives-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ai-memory-packages/*.tgz
            ${{ runner.temp }}/ai-memory-packages/source-digests.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  checks:
    name: checks
    if: ${{ always() }}
    needs: [linux, macos, package, selection, postgres]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.selection.result == 'success' && needs.selection.outputs.validation == 'metadata' && 360 || 5 }}
    concurrency:
      group: ${{ github.workflow }}-metadata-proof-${{ needs.selection.result == 'success' && needs.selection.outputs.validation == 'metadata' && 'metadata' || github.run_id }}-${{ needs.selection.result == 'success' && needs.selection.outputs.validation == 'metadata' && 'shared' || github.run_attempt }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out aggregation owner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Verify actual full source coverage
        if: ${{ needs.selection.result == 'success' && needs.selection.outputs.validation == 'metadata' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VALIDATION_MODE: ${{ needs.selection.outputs.validation }}
          SELECTION_RESULT: ${{ needs.selection.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: node scripts/ci-postgres-impact.mjs metadata
      - name: Require every coverage lane
        if: ${{ needs.selection.result != 'success' || needs.selection.outputs.validation != 'metadata' }}
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SELECTION_RESULT: ${{ needs.selection.result }}
          POSTGRES_RUN: ${{ needs.selection.outputs.run }}
          POSTGRES_REASON: ${{ needs.selection.outputs.reason }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: node scripts/ci-postgres-impact.mjs aggregate
